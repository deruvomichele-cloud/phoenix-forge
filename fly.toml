app = 'phoenix-forge-dyf9ww'
primary_region = 'ams'

[build]

[env]
  GITHUB_REPO = 'deruvomichele-cloud/phoenix-forge'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
